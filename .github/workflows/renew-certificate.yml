name: Renew HTTPS certificate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/renew_certificate.py'
      - '.github/workflows/renew-certificate.yml'
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: truthhub-production
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Set up Python on GitHub
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install certificate client on GitHub
        run: python -m pip install acme==5.8.0
      - name: Load deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cse3100_deploy
          chmod 600 ~/.ssh/cse3100_deploy
          ssh-keyscan -H 187.52.122.100 >> ~/.ssh/known_hosts
      - name: Renew certificate when fewer than 30 days remain
        env:
          DEPLOY_KEY_PATH: /home/runner/.ssh/cse3100_deploy
        run: python .github/scripts/renew_certificate.py
      - name: Verify HTTPS health
        run: curl --fail --retry 3 --retry-delay 5 https://truthhub.austattendance.online/up
