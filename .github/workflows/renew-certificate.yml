name: Renew HTTPS certificate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/renew_certificate.py'
      - '.github/workflows/renew-certificate.yml'

permissions:
  contents: read

concurrency:
  group: truthhub-production
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Check VPS connectivity
        id: check-vps
        run: |
          if nc -z -w 5 187.52.122.100 22 2>/dev/null || timeout 5 bash -c "</dev/tcp/187.52.122.100/22" 2>/dev/null; then
            echo "online=true" >> "$GITHUB_OUTPUT"
            echo "VPS is online. Proceeding with certificate check."
          else
            echo "online=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=VPS Offline::Server 187.52.122.100 is currently offline or unreachable. Skipping certificate renewal."
          fi
      - name: Set up Python on GitHub
        if: steps.check-vps.outputs.online == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install certificate client on GitHub
        if: steps.check-vps.outputs.online == 'true'
        run: python -m pip install acme==2.11.0 josepy==1.14.0 cryptography requests
      - name: Load deploy key
        if: steps.check-vps.outputs.online == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cse3100_deploy
          chmod 600 ~/.ssh/cse3100_deploy
          ssh-keyscan -H 187.52.122.100 >> ~/.ssh/known_hosts
      - name: Renew certificate when fewer than 30 days remain
        if: steps.check-vps.outputs.online == 'true'
        env:
          DEPLOY_KEY_PATH: /home/runner/.ssh/cse3100_deploy
        run: python .github/scripts/renew_certificate.py
      - name: Verify HTTPS health
        if: steps.check-vps.outputs.online == 'true'
        run: curl --fail --retry 3 --retry-delay 5 https://truthhub.austattendance.online/up
