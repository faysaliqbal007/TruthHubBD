name: Update upload malware scanner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/prepare_scanner.sh'
      - '.github/scripts/deploy_scanner.py'
      - '.github/workflows/update-scanner.yml'
  schedule:
    - cron: '43 3 * * *'

permissions:
  contents: read

concurrency:
  group: truthhub-production
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Prepare official scanner and signed definitions on GitHub
        run: bash .github/scripts/prepare_scanner.sh
      - name: Load deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cse3100_deploy
          chmod 600 ~/.ssh/cse3100_deploy
          ssh-keyscan -H 187.52.122.100 >> ~/.ssh/known_hosts
      - name: Copy prepared scanner with scp
        run: scp -i ~/.ssh/cse3100_deploy -o BatchMode=yes scanner-release.tar.gz scanner-release.tar.gz.sha256 s20230204112@187.52.122.100:
      - name: Verify and enable scanner in own account folder
        run: ssh -i ~/.ssh/cse3100_deploy -o BatchMode=yes s20230204112@187.52.122.100 'python3 -' < .github/scripts/deploy_scanner.py
      - name: Check live health
        run: curl --fail --retry 3 --retry-delay 5 https://truthhub.austattendance.online/up
