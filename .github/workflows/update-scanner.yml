name: Update upload malware scanner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/prepare_scanner.sh'
      - '.github/scripts/deploy_scanner.py'
      - '.github/workflows/update-scanner.yml'
  schedule:
    - cron: '43 3 * * *'

permissions:
  contents: read

concurrency:
  group: truthhub-production
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Prepare official scanner and signed definitions on GitHub
        run: |
          set +e
          bash .github/scripts/prepare_scanner.sh 2>&1 | tee scanner-preparation.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          message = Path('scanner-preparation.log').read_text(errors='replace')[-6000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Scanner preparation details::' + message)
          PY
            exit "$result"
          fi
      - name: Load deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cse3100_deploy
          chmod 600 ~/.ssh/cse3100_deploy
          ssh-keyscan -H 187.52.122.100 >> ~/.ssh/known_hosts
      - name: Copy prepared scanner with scp
        run: |
          scp -i ~/.ssh/cse3100_deploy -o BatchMode=yes scanner-release.tar.gz scanner-release.tar.gz.sha256 s20230204112@187.52.122.100:
      - name: Verify and enable scanner in own account folder
        run: |
          set +e
          ssh -i ~/.ssh/cse3100_deploy -o BatchMode=yes s20230204112@187.52.122.100 'python3 -' < .github/scripts/deploy_scanner.py 2>&1 | tee scanner-deployment.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          message = Path('scanner-deployment.log').read_text(errors='replace')[-6000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=VPS scanner deployment details::' + message)
          PY
            exit "$result"
          fi
      - name: Check live health
        run: curl --fail --retry 3 --retry-delay 5 https://truthhub.austattendance.online/up
