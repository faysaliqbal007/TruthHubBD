name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truthhub-production
  cancel-in-progress: false

env:
  DEPLOY_USER: s20230204112
  DEPLOY_HOST: 187.52.122.100

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip
          coverage: none
      - name: Install PHP packages
        working-directory: backend
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build static React app
        working-directory: frontend
        run: |
          npm ci
          cp -R public/. ../backend/public/
          npm run build
          test -f ../backend/public/app/index.html
      - name: Write release version
        run: |
          printf '{"version":"1.0.0","commit":"%s","deployed_at":"%s"}\n' "${{ github.sha }}" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > backend/version.json
      - name: Pack release
        run: |
          tar -czf release.tar.gz --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='.env.*' --exclude='storage/logs/*.log' --exclude='storage/framework/testing' --exclude='bootstrap/cache/*.php' -C backend .
          tar -tzf release.tar.gz > release-files.txt
          if grep -E '(^|/)(\.env([^/]*|$)|\.git|node_modules)(/|$)' release-files.txt; then
            echo 'Release contains forbidden files'
            exit 1
          fi
          grep -qx './vendor/autoload.php' release-files.txt
          grep -qx './public/app/index.html' release-files.txt
      - name: Load deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cse3100_deploy
          chmod 600 ~/.ssh/cse3100_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Copy release with scp
        run: scp -i ~/.ssh/cse3100_deploy -o BatchMode=yes release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:release.tar.gz"
      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/cse3100_deploy -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          cd "$HOME/laravel"
          test -f .env
          tar -tzf "$HOME/release.tar.gz" > "$HOME/release-files.txt"
          if grep -E '(^|/)(\.env([^/]*|$)|\.git|node_modules)(/|$)|(^/|(^|/)\.\.(/|$))' "$HOME/release-files.txt"; then
            echo 'Unsafe release archive'
            exit 1
          fi
          tar -xzf "$HOME/release.tar.gz" -C "$HOME/laravel"
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          chmod -R u+rwX storage bootstrap/cache
          setfacl -R -m u:www-data:rX -m d:u:www-data:rX public
          php artisan optimize:clear
          php artisan migrate --force
          php artisan storage:link
          php artisan optimize
          rm "$HOME/release.tar.gz" "$HOME/release-files.txt"
          REMOTE
      - name: Check live health
        run: |
          curl --fail --retry 3 --retry-delay 5 "https://truthhub.austattendance.online/up"
          curl --fail --retry 3 --retry-delay 5 "https://truthhub.austattendance.online/api/health"
